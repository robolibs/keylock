language = "C"
include_guard = "KEYLOCK_H"
cpp_compat = true
documentation = true
style = "type"
no_includes = false
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]

[parse]
parse_deps = false

[enum]
rename_variants = "QualifiedScreamingSnakeCase"
prefix_with_name = true

[export]
include = [
    "KeylockBytes",
    "keylock_last_error_message",
    "keylock_version",
    "keylock_random_bytes",
    "keylock_random_uniform",
    "keylock_sha256",
    "keylock_keccak256",
    "keylock_bytes_equal",
]
exclude = ["Algorithm", "HashAlgorithm", "KeyFormat", "KeyType", "keylock"]
item_types = ["structs", "functions", "typedefs", "opaque"]
