[package]
name = "keylock"
version = "0.0.1"
edition = "2024"
description = "Pure Rust keylock compatibility crate extracted from authbox"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
tracing = []
config = []

[dependencies]
aes = "0.8"
aes-gcm = { version = "0.10", features = ["alloc"] }
argon2 = "0.5"
blake2 = "0.10"
chacha20 = "0.9"
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
crypto_secretbox = { version = "0.1", features = ["alloc"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
getrandom = "0.2"
hkdf = "0.12"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
hmac = "0.12"
k256 = { version = "0.13", features = ["ecdsa"] }
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
pkcs8 = { version = "0.10", features = ["alloc"] }
poly1305 = "0.8"
rand_core = "0.6"
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
sha3 = "0.10"
skein = "0.1"
sm3 = "0.4"
streebog = "0.10"
subtle = "2"
whirlpool = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"

[dev-dependencies]
x25519-dalek = "2"
